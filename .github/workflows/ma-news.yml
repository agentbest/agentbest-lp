# M&Aニュースの日次更新
#
# 東証の適時開示（TDnet）からM&A案件を拾い、src/content/news/ に記事を書き足してpushする。
# pushされるとVercelが自動でデプロイするので、人の作業は入らない。
#
# 手で流したいときは Actions タブ →「M&Aニュースの日次更新」→ Run workflow。
name: M&Aニュースの日次更新

on:
  schedule:
    # 07:10 JST（UTC 22:10）。TDnetの開示は19時ごろまで出るので、前日分を翌朝まとめて拾う
    - cron: '10 22 * * *'
  workflow_dispatch:
    inputs:
      days:
        description: '何日分さかのぼるか'
        required: false
        default: '3'

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # PDFからテキストを抜くのに pdftotext（poppler）を使う
      - name: pdftotext を入れる
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends poppler-utils

      - name: 適時開示から記事を生成
        run: node tools/ma-news/run.mjs --days ${{ github.event.inputs.days || 3 }}

      - name: 変更があればコミットしてpush
        run: |
          if [ -z "$(git status --porcelain src/content/news tools/ma-news/log)" ]; then
            echo "新しい開示なし。何もしない"
            exit 0
          fi
          git config user.name  "ma-news bot"
          git config user.email "actions@users.noreply.github.com"
          git add src/content/news tools/ma-news/log
          n=$(git diff --cached --name-only --diff-filter=A src/content/news | wc -l)
          git commit -m "M&Aニュース ${n}本を追加（適時開示より自動生成）"
          git push
